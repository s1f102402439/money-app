# Dependabotに「どの依存関係を、いつ確認するか」を伝える設定です。
# 小規模な個人開発でPRが増えすぎないよう、通常更新は月1回にまとめます。
version: 2

updates:
  # requirements.in（希望範囲）とpip-compileで固定したrequirements.txtを確認します。
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    # 現在の希望範囲が新版を許可していれば、下限をむやみに引き上げず
    # requirements.txtの固定版だけを更新します。範囲外のときだけ.inも変更します。
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # frontend/package.jsonとpackage-lock.jsonのnpmパッケージを確認します。
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ci.yml内で利用する公式Action自体の更新も確認します。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Dockerfileを検査するCIができるまでは、通常のイメージ更新PRを作りません。
  # 0はDependabotのバージョン更新PRを停止する設定です。
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0

  # ComposeのPostgreSQLも、DB移行を伴うため自動提案を一時停止します。
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0
