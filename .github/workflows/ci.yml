# GitHub上でコードを自動検査するワークフローです。
# ローカルでREADMEの「検査コマンド」を実行するのと同じ確認を行います。
name: CI

# いつ自動検査を始めるかを定義します。
on:
  # mainへ取り込むPull Requestを作成・更新したときに実行します。
  pull_request:
    branches:
      - main

  # mainへ変更が入った後にも実行し、統合後の状態が正常か確認します。
  push:
    branches:
      - main

  # GitHubのActions画面から、必要なときに手動実行できます。
  workflow_dispatch:

# このワークフローはコードを読むだけでよく、書き込み権限は与えません。
permissions:
  contents: read

# 同じブランチへ続けてpushした場合、古い検査を止めて最新の検査を優先します。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: Python dependencies / Lock file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.in

      # Dependabotが対応するpip-tools 7.5.3で固定結果を再生成します。
      - name: Install dependency compiler
        run: python -m pip install pip-tools==7.5.3

      # requirements.inを変更したのにrequirements.txtを更新し忘れた場合、
      # 再生成後のgit diffが残るため、この検査が失敗します。
      - name: Check compiled dependency lock
        run: |
          pip-compile --strip-extras --output-file=requirements.txt requirements.in
          git diff --exit-code -- requirements.txt

  backend-sqlite:
    name: Backend / Django (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # POSTGRES_HOSTを設定しないため、CIでは外部DB不要のSQLiteを使います。
      # ここに書く秘密鍵はCI専用で、本番の秘密情報ではありません。
      - name: Check Django settings
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "false"
        run: python manage.py check

      # モデルを変更したのにmigrationファイルを作り忘れていないか確認します。
      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "false"
        run: python manage.py makemigrations --check --dry-run

      # Djangoの自動テストをすべて実行します。
      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "false"
        run: python manage.py test

  backend-postgresql:
    name: Backend / Django (PostgreSQL 15)
    runs-on: ubuntu-latest

    # GitHub Actions内に一時的なPostgreSQLを起動します。
    # health checkが通るまで、下のDjango検査は始まりません。
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: paymate_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paymate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # POSTGRES_HOSTがあると、config/settings.pyはSQLiteではなくPostgreSQLを選びます。
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "false"
      POSTGRES_NAME: paymate_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # migrateが成功すれば、psycopg経由でPostgreSQLへ接続し、
      # 現在のテーブル定義を実際に適用できることも確認できます。
      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Check Django settings
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Djangoはテスト専用DBをPostgreSQL内に作成して検査後に削除します。
      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: Frontend / React
    runs-on: ubuntu-latest

    # frontend配下を基準にすることで、各runに毎回cdを書く必要をなくします。
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # READMEで推奨しているNode.js 22をCIでも使用します。
      # package-lock.jsonをもとにnpmのダウンロード結果も再利用します。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm installと違い、lockファイルどおりのバージョンを再現します。
      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # 本番配信用ファイルを実際に生成できることまで確認します。
      - name: Build frontend
        run: npm run build
